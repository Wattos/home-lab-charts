apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app }}
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  selector:
    matchLabels:
      app: {{ .Values.app }}
  replicas: {{ default 1 .Values.servarr.replicaCount | int }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Values.app }}
    spec:
      # The *arr apps rewrite config.xml at startup, so it can't be a read-only
      # ConfigMap mount. Copy the rendered config into the writable PVC instead.
      initContainers:
      - name: config-xml
        image: busybox:1.37
        command:
        - sh
        - -c
        - cp /config-template/config.xml /config/config.xml && chown {{ .Values.servarr.uid }}:{{ .Values.servarr.gid }} /config/config.xml && chmod 600 /config/config.xml
        volumeMounts:
        - name: "{{ .Values.app }}-config"
          mountPath: /config
        - name: "{{ .Values.app }}-config-xml"
          mountPath: /config-template
          readOnly: true
      containers: {{ $app := (index .Values .Values.app) }}
      - name: "{{ .Values.app }}"
        image: "{{ $app.image }}"
        imagePullPolicy: Always
        ports:
        - containerPort: {{ $app.container.port | int }}
        env:
        - name: PGID
          value: "{{ .Values.servarr.uid }}"
        - name: PUID
          value: "{{ .Values.servarr.gid }}"
        - name: TZ
          value: "{{ .Values.servarr.timezone }}"
        volumeMounts:
        - name: "{{ .Values.app }}-config"
          mountPath: /config
        {{- if $app.media.enabled }}
        - name: "{{ .Values.app }}-media"
          mountPath: /media
        {{- end }}
      volumes:
      - name: "{{ .Values.app }}-config"
        persistentVolumeClaim:
          claimName: "{{ .Values.app }}-config"
      - name: "{{ .Values.app }}-config-xml"
        configMap:
          name: {{ .Values.app }}-config-xml
      {{- if $app.media.enabled }}
      - name: "{{ .Values.app }}-media"
        nfs:
          server: "{{ .Values.servarr.media.volume.nfs.server }}"
          path: "{{ .Values.servarr.media.volume.nfs.path }}"
      {{- end }}